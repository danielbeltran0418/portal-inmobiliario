name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  verificar:
    # ubuntu-latest trae Docker preinstalado, que es lo que necesita la pila
    # local de Supabase.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Buscar secretos filtrados
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 22, no 20. @supabase/realtime-js (dependencia de @supabase/supabase-js,
      # que usan las pruebas de RLS) exige un WebSocket global, y en Node solo
      # existe a partir de la 21 -- estable en la 22. Con la 20 el cliente ni
      # se construye: "Node.js detected but native WebSocket not found", y
      # `npm run test:rls` cae entero antes de la primera asercion.
      #
      # No se veia en local porque alli se corre con Node 22+.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar el CLI de Supabase
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Levantar la pila local de Supabase
        run: supabase start

      # El runner no tiene .env.local (esta en .gitignore) y las pruebas ya no
      # dependen de ese archivo: leen process.env. Aqui se exporta el entorno
      # real de la pila recien levantada.
      #
      # No basta con `supabase status -o env >> $GITHUB_ENV`, por tres razones
      # comprobadas contra el CLI:
      #   1. Los nombres que emite son API_URL / ANON_KEY / SERVICE_ROLE_KEY, no
      #      los que usa la aplicacion. Se remapean con --override-name.
      #   2. Los valores salen entre comillas dobles; el formato de $GITHUB_ENV
      #      es literal y las comillas quedarian DENTRO del valor. El sed las
      #      quita.
      #   3. El CLI imprime en stdout lineas que no son variables (p. ej.
      #      "Stopped services: [...]"), y una linea sin '=' hace fallar el
      #      paso con "Invalid format". El grep deja pasar solo las claves
      #      que se usan.
      - name: Exportar el entorno de Supabase
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name db.url=SUPABASE_DB_URL \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY|SUPABASE_DB_URL)=' \
            | sed 's/="\(.*\)"$/=\1/' \
            >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "APP_ENTORNO=local" >> "$GITHUB_ENV"

      - name: Verificar que el entorno quedo exportado
        run: |
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL; do
            if [ -z "${!v}" ]; then
              echo "::error::$v quedo vacia tras exportar el entorno de Supabase"
              exit 1
            fi
          done
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"

      # Aplica migraciones y seed sobre una base limpia. `supabase start` ya lo
      # hace en un arranque en frio, pero el reset explicito deja el paso
      # visible en el log y es idempotente si la pila se reutiliza.
      - name: Aplicar migraciones y seed
        run: supabase db reset

      - run: npm run lint

      # Genera .next/types/, de donde salen los tipos por ruta que escribe Next
      # (LayoutProps, PageProps...). src/app/layout.tsx usa LayoutProps<"/">, y
      # tsconfig.json incluye ".next/types/**/*.ts" para verlos.
      #
      # Sin este paso `tsc --noEmit` cae con "Cannot find name 'LayoutProps'" y
      # se lleva por delante el resto del job: las pruebas unitarias, las de RLS
      # y las e2e ni se ejecutan. En local no se nota porque `next dev` deja
      # .next/ escrito, asi que el fallo solo se ve aqui.
      #
      # Va antes de tsc y no vale con el `npm run build` de mas abajo, que
      # tambien los genera: para entonces tsc ya ha fallado.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run test:rls
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # La cuenta vendedor es compartida por estos dos specs. La suite completa
      # ya corre una vez; repetir solo esta pareja tres veces da seis ejecuciones
      # adicionales en lugar de triplicar todos los E2E, y mantiene visible la
      # carrera entre el panel y el cierre de sesion con un coste acotado.
      - name: Repetir E2E con estado compartido
        run: npx playwright test tests/e2e/cabecera-y-sesion.spec.ts tests/e2e/panel-vendedor.spec.ts --repeat-each=5
      - run: npm run build

      # Guarda del criterio 8 sobre la salida real del build.
      #
      # Va DESPUES de `npm run build` a proposito: lee .next/, que es lo que el
      # build acaba de escribir. El script aborta si ese directorio no esta, asi
      # que un build que no llegue a correr no lo deja pasar por vacio.
      #
      # Lo que vigila: que ninguna pagina quede prerenderizada. Un HTML escrito
      # en build no puede llevar el nonce de la CSP -- se genera por peticion en
      # el middleware -- y con 'strict-dynamic' en la politica esos <script>
      # quedan bloqueados: la pagina se sirve y no hidrata. Ya paso una vez en
      # esta rama, y las otras tres redes no lo cubren (ver el comentario largo
      # dentro del script).
      - name: Verificar que no hay paginas prerenderizadas
        run: npm run verificar:render
